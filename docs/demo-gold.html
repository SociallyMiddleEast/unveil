<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a0006">
<title>The Stage · Unveil demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Great+Vibes&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* A full-screen theatre: red glitter you blow away, velvet curtains that part, a couple dancing in a spotlight. */
:root {
  --red-deep: #2a0006; --red: #8f0a1c; --red-bright: #d11a2e; --cream: #fff3ea; --gold: #e7c98f;
  --display: "Bodoni Moda", "Didot", Georgia, serif; --script: "Great Vibes", "Snell Roundhand", cursive; --ui: "Jost", "Futura", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--red-deep); color: var(--cream); font-family: var(--ui); -webkit-font-smoothing: antialiased; }
body { touch-action: none; user-select: none; -webkit-user-select: none; }

/* ---------- The stage behind the curtains ---------- */
.stage { position: fixed; inset: 0; overflow: hidden;
  background: radial-gradient(70% 45% at 50% 82%, #4a0610 0%, #1c0004 70%), #120002; }
.beams { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 2s ease 1.2s; mix-blend-mode: screen; }
.lit .beams { opacity: 1; }
.beam { position: absolute; top: -20%; height: 140%; transform-origin: 50% 0; filter: blur(8px); }
.beam.b1 { left: -10%; width: 34%; transform: rotate(-24deg); background: linear-gradient(180deg, rgba(255,214,220,.55), rgba(255,170,180,.12) 70%, transparent); clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); }
.beam.b2 { left: 18%; width: 30%; transform: rotate(-12deg); background: linear-gradient(180deg, rgba(255,230,232,.45), rgba(255,180,190,.08) 75%, transparent); clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); }
.beam.b3 { right: -6%; width: 26%; transform: rotate(18deg); background: linear-gradient(180deg, rgba(255,200,210,.25), transparent 70%); clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); }
.platform { position: absolute; left: 50%; bottom: 7%; width: 78%; max-width: 420px; aspect-ratio: 4 / 1; transform: translateX(-50%); border-radius: 50%; opacity: 0; transition: opacity 1.6s ease 1.8s;
  background: radial-gradient(closest-side, rgba(255,235,236,.95), rgba(255,140,155,.55) 45%, rgba(209,26,46,.25) 70%, transparent);
  box-shadow: 0 0 60px 10px rgba(255,120,140,.35); }
.platform::after { content: ""; position: absolute; inset: 18% 6%; border-radius: 50%; border: 2px solid rgba(255,240,240,.85); filter: blur(.5px); }
.lit .platform { opacity: 1; }
.mist { position: absolute; left: -20%; right: -20%; bottom: -6%; height: 34%; opacity: 0; transition: opacity 2.4s ease 2s; pointer-events: none;
  background: radial-gradient(40% 60% at 30% 70%, rgba(255,220,225,.35), transparent 70%), radial-gradient(45% 55% at 70% 75%, rgba(255,200,210,.3), transparent 70%);
  filter: blur(14px); animation: drift 9s ease-in-out infinite alternate; }
.lit .mist { opacity: 1; }
@keyframes drift { to { transform: translateX(6%); } }
.couple { position: absolute; left: 50%; bottom: 9%; width: min(72vw, 340px); transform: translateX(-50%); opacity: 0; transition: opacity 2s ease 2.2s; filter: drop-shadow(0 0 18px rgba(255,170,185,.45)); }
.lit .couple { opacity: 1; }
.couple svg { width: 100%; height: auto; display: block; }
.couple-video { position: absolute; left: 50%; bottom: 6%; height: 52%; max-width: 100%; transform: translateX(-50%); object-fit: contain;
  mix-blend-mode: screen; opacity: 0; transition: opacity 2s ease 2.2s; filter: saturate(1.05) contrast(1.05) drop-shadow(0 0 22px rgba(255,170,185,.35)); }
.lit .couple-video { opacity: 1; }
/* The dance: the couple turn around each other, sway, rise and fall, and the dress swirls. */
.spin { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 7s cubic-bezier(.6,0,.4,1) infinite; }
@keyframes spin { 0%, 30% { transform: scaleX(1); } 50%, 80% { transform: scaleX(-1); } 100% { transform: scaleX(1); } }
.sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 3.5s ease-in-out infinite; }
@keyframes sway {
  0% { transform: translate(-7px, 0) rotate(-3deg); }
  25% { transform: translate(0, -5px) rotate(0deg); }
  50% { transform: translate(7px, 0) rotate(3deg); }
  75% { transform: translate(0, -5px) rotate(0deg); }
  100% { transform: translate(-7px, 0) rotate(-3deg); }
}
.skirt { transform-box: fill-box; transform-origin: 50% 0; animation: skirt 1.75s ease-in-out infinite alternate; }
@keyframes skirt { from { transform: skewX(-7deg) scaleX(.94); } to { transform: skewX(7deg) scaleX(1.07); } }
.dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* ---------- Words over the stage ---------- */
.words { position: fixed; left: 0; right: 0; top: calc(7% + env(safe-area-inset-top, 0px)); text-align: center; z-index: 30; padding: 0 20px; pointer-events: none; }
.w-fam { font-family: var(--display); font-style: italic; font-size: 14px; opacity: 0; transition: opacity 1.2s ease; }
.w-name { font-family: var(--script); font-size: clamp(52px, 15vw, 84px); line-height: 1; color: var(--cream); text-shadow: 0 0 18px rgba(255,190,200,.55);
  display: inline-block; clip-path: inset(-20% 100% -20% 0); }
.w-amp { font-family: var(--script); font-size: 30px; display: block; opacity: 0; transition: opacity .8s ease; margin: -4px 0; }
.write { animation: write 2.2s cubic-bezier(.45,.05,.4,1) forwards; }
@keyframes write { to { clip-path: inset(-20% -6% -20% 0); } }
.w-req { font-family: var(--display); font-style: italic; font-size: 15px; margin-top: 10px; opacity: 0; transition: opacity 1.2s ease; }
.w-date { font-family: var(--display); font-size: 17px; letter-spacing: .3em; padding-left: .3em; margin-top: 8px; opacity: 0; transition: opacity 1.2s ease; }
.w-place { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; opacity: 0; transition: opacity 1.2s ease; }
.show { opacity: 1 !important; }
.after { position: fixed; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 0 16px; opacity: 0; transition: opacity 1s ease; pointer-events: none; }
.after.show { pointer-events: auto; }
.btn { font-family: var(--ui); font-size: 11.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; border-radius: 999px; padding: 11px 18px;
  border: 1px solid var(--cream); background: var(--cream); color: var(--red-deep); cursor: pointer; }
.btn.ghost { background: rgba(20,0,4,.4); color: var(--cream); border-color: rgba(255,243,234,.5); }

/* ---------- Curtains ---------- */
canvas.curtain { position: fixed; top: 0; height: 100%; width: 50.5%; z-index: 20; transition: transform 5s cubic-bezier(.55,.02,.25,1); }
#curL { left: 0; transform-origin: 0 50%; }
#curR { right: 0; transform-origin: 100% 50%; }
.opening #curL { transform: translateX(-34%) scaleX(.42); }
.opening #curR { transform: translateX(34%) scaleX(.42); }
canvas#valance { position: fixed; top: 0; left: 0; width: 100%; height: 8%; z-index: 21; }

/* ---------- Glitter sheet ---------- */
canvas#glitter { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 50; transition: opacity 1.1s ease; }
canvas#glitter.gone { opacity: 0; }
.cover { position: fixed; inset: 0; z-index: 60; pointer-events: none; transition: opacity .9s ease; }
.cover.gone { opacity: 0; }
.cover .top { position: absolute; left: 0; right: 0; top: calc(9% + env(safe-area-inset-top, 0px)); text-align: center; padding: 0 28px; font-family: var(--display); font-style: italic; font-size: 15px; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.cover .top small { display: block; margin-top: 6px; font-family: var(--ui); font-style: normal; font-size: 9.5px; letter-spacing: .3em; text-transform: uppercase; opacity: .75; }
.cover .bottom { position: absolute; left: 0; right: 0; bottom: calc(15% + env(safe-area-inset-bottom, 0px)); text-align: center; }
.cover .call { font-family: var(--script); font-size: 46px; line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.cover .sub { font-family: var(--display); font-style: italic; font-size: 13px; opacity: .85; margin-top: 6px; }
.cover .start { margin-top: 18px; pointer-events: auto; }
.cover .alt { font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; opacity: .65; margin-top: 12px; }
.pulse { animation: pulse 2.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }

@media (prefers-reduced-motion: reduce) {
  canvas.curtain { transition-duration: 1.2s; }
  .write { animation-duration: .6s; }
  .mist, .sway, .spin, .skirt, .pulse { animation: none; }
}
</style>
</head>
<body>

<main class="stage" id="stage">
  <div class="beams"><div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div></div>
  <div class="mist"></div>
  <div class="platform"></div>
  <!-- Real dancing couple: put a clip of a couple filmed on a plain black background at docs/assets/couple.mp4.
       The black disappears into the stage (screen blend). If the file is missing, the drawn couple below is used. -->
  <video class="couple-video" id="coupleVideo" muted playsinline loop preload="auto" aria-hidden="true" hidden>
    <source src="assets/couple.mp4" type="video/mp4">
  </video>
  <div class="couple" id="coupleArt" aria-hidden="true">
    <svg viewBox="0 0 300 330">
      <defs>
        <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8f6"/><stop offset=".55" stop-color="#ffd9de"/><stop offset="1" stop-color="#ff9fae"/></linearGradient>
        <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1018"/><stop offset="1" stop-color="#14040a"/></linearGradient>
        <radialGradient id="skin" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffe3d6"/><stop offset="1" stop-color="#e9b7a6"/></radialGradient>
      </defs>
      <g class="spin"><g class="sway">
        <!-- groom -->
        <path d="M168 120 C160 150 160 190 164 232 L168 318 L184 318 L186 246 L192 318 L208 318 L206 232 C210 190 206 150 196 122 Z" fill="url(#suit)"/>
        <path d="M168 122 C176 112 192 112 198 124 L204 160 L166 160 Z" fill="url(#suit)"/>
        <path d="M180 124 L184 150 L188 124 Z" fill="#f4e6e6"/>
        <circle cx="185" cy="102" r="15" fill="url(#skin)"/>
        <path d="M171 98 C172 84 196 82 199 98 C196 92 178 90 171 98 Z" fill="#2a0c10"/>
        <path d="M170 130 C150 140 136 150 124 150" stroke="#2a0c14" stroke-width="11" stroke-linecap="round" fill="none"/>
        <!-- bride -->
        <path class="skirt" d="M126 140 C110 180 92 230 40 316 C110 330 190 330 236 316 C200 250 170 190 152 140 Z" fill="url(#dress)"/>
        <path d="M60 300 C100 290 150 300 200 294" stroke="#ffffff" stroke-opacity=".5" stroke-width="2" fill="none"/>
        <path d="M80 270 C110 262 150 268 180 262" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" fill="none"/>
        <path d="M128 142 C126 118 132 104 140 100 C148 104 154 118 150 142 Z" fill="#fff4f2"/>
        <circle cx="140" cy="86" r="13" fill="url(#skin)"/>
        <path d="M127 84 C126 70 152 66 154 84 C158 92 156 104 150 110 C150 96 146 86 140 82 C134 86 130 92 127 84 Z" fill="#3b1a12"/>
        <path d="M152 82 C190 96 214 150 230 230 C200 180 176 130 150 104 Z" fill="#ffffff" fill-opacity=".35"/>
        <path d="M150 112 C162 108 174 116 182 126" stroke="url(#skin)" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path d="M130 116 C118 130 116 140 122 150" stroke="url(#skin)" stroke-width="7" stroke-linecap="round" fill="none"/>
      </g></g>
    </svg>
  </div>
  <canvas class="dust" id="dust"></canvas>
</main>

<canvas class="curtain" id="curL" aria-hidden="true"></canvas>
<canvas class="curtain" id="curR" aria-hidden="true"></canvas>
<canvas id="valance" aria-hidden="true"></canvas>

  <div class="words">
    <div class="w-fam" id="wFam">Together with their families</div>
    <div><span class="w-name" id="wN1">Lara</span></div>
    <span class="w-amp" id="wAmp">&amp;</span>
    <div><span class="w-name" id="wN2">Karim</span></div>
    <div class="w-req" id="wReq">invite you to celebrate their wedding</div>
    <div class="w-date" id="wDate">12 · 06 · 2027</div>
    <div class="w-place" id="wPlace">The Harbour Terrace · Byblos, Lebanon</div>
  </div>
  <div class="after" id="after">
    <a class="btn" href="demo.html?reveal=none">Open the invitation</a>
    <button class="btn ghost" type="button" id="again">Watch again</button>
  </div>

<canvas id="glitter" aria-hidden="true"></canvas>
<div class="cover" id="cover">
  <div class="top">Something beautiful is waiting beneath the sparkle<small>Lara &amp; Karim</small></div>
  <div class="bottom">
    <div class="call pulse" id="call">Blow gently</div>
    <div class="sub" id="sub">one soft breath on your screen</div>
    <button class="btn start" type="button" id="startBtn">Tap to begin</button>
    <div class="alt" id="alt">or brush it away with your finger</div>
  </div>
</div>

<script>
(function () {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  let W, H, DPR;

  /* ===== Velvet curtain texture ===== */
  function drawCurtain(cv, mirror) {
    const w = Math.round(cv.clientWidth * DPR), h = Math.round(cv.clientHeight * DPR);
    cv.width = w; cv.height = h;
    const x = cv.getContext('2d');
    const img = x.createImageData(w, 1);
    const cols = new Float32Array(w);
    for (let i = 0; i < w; i++) {
      const u = (mirror ? w - i : i) / DPR;
      const f = .55 * Math.sin(u / 11) + .3 * Math.sin(u / 4.3 + 1.7) + .15 * Math.sin(u / 23 + .4);
      cols[i] = .5 + .5 * f;
    }
    for (let i = 0; i < w; i++) {
      const b = Math.pow(cols[i], 1.6);
      img.data[i * 4] = 40 + 200 * b; img.data[i * 4 + 1] = 2 + 22 * b; img.data[i * 4 + 2] = 10 + 34 * b; img.data[i * 4 + 3] = 255;
    }
    for (let y = 0; y < h; y++) x.putImageData(img, 0, y);
    // light from above, shadow at the floor, darker towards the outer edge
    let g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, 'rgba(0,0,0,.55)'); g.addColorStop(.18, 'rgba(0,0,0,.05)'); g.addColorStop(.55, 'rgba(255,60,80,.06)'); g.addColorStop(1, 'rgba(0,0,0,.6)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    g = x.createLinearGradient(mirror ? w : 0, 0, mirror ? 0 : w, 0);
    g.addColorStop(0, 'rgba(0,0,0,.5)'); g.addColorStop(.7, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.25)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  }
  function drawValance() {
    const cv = $('valance'), w = Math.round(cv.clientWidth * DPR), h = Math.round(cv.clientHeight * DPR);
    cv.width = w; cv.height = h;
    const x = cv.getContext('2d');
    const n = Math.max(6, Math.round(W / 70)), sw = w / n;
    for (let i = 0; i < n; i++) {
      const g = x.createRadialGradient(sw * i + sw / 2, 0, 2, sw * i + sw / 2, 0, sw * .9);
      g.addColorStop(0, '#c41a2c'); g.addColorStop(.7, '#6a0714'); g.addColorStop(1, '#2a0006');
      x.fillStyle = g;
      x.beginPath(); x.moveTo(sw * i, 0); x.lineTo(sw * (i + 1), 0); x.lineTo(sw * (i + 1), h * .55);
      x.quadraticCurveTo(sw * i + sw / 2, h * 1.05, sw * i, h * .55); x.closePath(); x.fill();
    }
  }

  /* ===== Glitter sheet with an erase mask ===== */
  const gl = $('glitter'), gx = gl.getContext('2d');
  let tex, mask, mx, small, sx, cleared = false, started = false;
  function buildGlitter() {
    gl.width = W * DPR; gl.height = H * DPR;
    tex = document.createElement('canvas'); tex.width = gl.width; tex.height = gl.height;
    const t = tex.getContext('2d');
    const g = t.createLinearGradient(0, 0, 0, tex.height);
    g.addColorStop(0, '#5a0410'); g.addColorStop(1, '#3a0209');
    t.fillStyle = g; t.fillRect(0, 0, tex.width, tex.height);
    const shades = ['#7a0616', '#a80c20', '#c8142a', '#e0283c', '#ff4a5c', '#5a0010', '#ff8a96', '#ffd6da'];
    const n = Math.round(tex.width * tex.height / 9);
    for (let i = 0; i < n; i++) {
      const r = Math.random();
      t.fillStyle = shades[r < .9 ? (Math.random() * 6) | 0 : 6 + ((Math.random() * 2) | 0)];
      const s = (r < .97 ? 1 : 2) * DPR;
      t.fillRect(Math.random() * tex.width, Math.random() * tex.height, s, s);
    }
    mask = document.createElement('canvas'); mask.width = gl.width; mask.height = gl.height;
    mx = mask.getContext('2d'); mx.fillStyle = '#000'; mx.fillRect(0, 0, mask.width, mask.height);
    small = document.createElement('canvas'); small.width = 30; small.height = 60; sx = small.getContext('2d', { willReadFrequently: true });
  }
  function hole(px, py, r) {
    mx.save(); mx.globalCompositeOperation = 'destination-out';
    const R = r * DPR, X = px * DPR, Y = py * DPR;
    const g = mx.createRadialGradient(X, Y, 0, X, Y, R);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(.6, 'rgba(0,0,0,.6)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    mx.fillStyle = g; mx.beginPath(); mx.arc(X, Y, R, 0, 6.283); mx.fill(); mx.restore();
    for (let i = 0; i < 3; i++) flyers.push({ x: px, y: py, vx: (Math.random() - .5) * 3, vy: -1 - Math.random() * 3, a: 1, s: 1 + Math.random() * 1.5 });
  }
  const flyers = [];
  let frame = 0;
  function coverage() {
    sx.clearRect(0, 0, 30, 60); sx.drawImage(mask, 0, 0, 30, 60);
    const d = sx.getImageData(0, 0, 30, 60).data; let s = 0;
    for (let i = 3; i < d.length; i += 4) s += d[i];
    return s / (255 * 30 * 60);
  }
  function drawGlitter(t) {
    if (cleared && gl.classList.contains('gone') && !flyers.length) return;
    gx.globalCompositeOperation = 'source-over';
    gx.clearRect(0, 0, gl.width, gl.height);
    gx.drawImage(tex, 0, 0);
    // twinkles
    for (let i = 0; i < 220; i++) {
      const a = Math.random();
      gx.fillStyle = a < .5 ? 'rgba(255,220,226,.95)' : 'rgba(255,90,110,.9)';
      const s = (Math.random() < .15 ? 2.5 : 1.3) * DPR;
      gx.fillRect(Math.random() * gl.width, Math.random() * gl.height, s, s);
    }
    gx.globalCompositeOperation = 'destination-in';
    gx.drawImage(mask, 0, 0);
    gx.globalCompositeOperation = 'source-over';
    for (let i = flyers.length - 1; i >= 0; i--) {
      const f = flyers[i]; f.x += f.vx; f.y += f.vy; f.vy -= .02; f.a -= .02;
      if (f.a <= 0) { flyers.splice(i, 1); continue; }
      gx.globalAlpha = f.a; gx.fillStyle = '#ff9aa6'; gx.fillRect(f.x * DPR, f.y * DPR, f.s * DPR, f.s * DPR);
    }
    gx.globalAlpha = 1;
    if (blow > 0) {
      const k = Math.ceil(blow * 10);
      for (let i = 0; i < k; i++) hole(Math.random() * W, H - Math.pow(Math.random(), 1.8) * H * 1.05, 18 + 50 * blow * Math.random());
      blowTime += 1 / 60;
    }
    // A short breath or one swipe is enough: once a little is cleared, the rest melts away by itself.
    if (!cleared && ++frame % 8 === 0 && (userHoles >= 14 || blowTime > .5 || coverage() < .92)) reveal();
    requestAnimationFrame(drawGlitter);
  }

  /* ===== Microphone: breath detection ===== */
  let blow = 0, blowTime = 0, stream = null, actx = null, anal = null, buf = null, micRaf = 0;
  async function startMic() {
    $('startBtn').hidden = true;
    started = true;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const src = actx.createMediaStreamSource(stream);
      const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 200;
      anal = actx.createAnalyser(); anal.fftSize = 1024; buf = new Float32Array(anal.fftSize);
      src.connect(hp); hp.connect(anal);
      (function listen() {
        anal.getFloatTimeDomainData(buf);
        let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
        const v = Math.max(0, Math.min(1, (Math.sqrt(s / buf.length) - .015) / .1));
        blow = v > .1 ? v : 0;
        micRaf = requestAnimationFrame(listen);
      })();
    } catch (e) {
      $('call').textContent = 'Brush it away'; $('sub').textContent = 'swipe your finger across the screen'; $('alt').hidden = true;
    }
  }
  function stopMic() {
    cancelAnimationFrame(micRaf); blow = 0;
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (actx) actx.close().catch(() => {});
    stream = actx = null;
  }
  $('startBtn').addEventListener('click', e => { e.stopPropagation(); startMic(); });

  /* ===== Finger brushing ===== */
  let down = false, last = null, userHoles = 0;
  gl.addEventListener('pointerdown', e => { down = true; last = [e.clientX, e.clientY]; hole(e.clientX, e.clientY, 46); userHoles++; });
  addEventListener('pointermove', e => {
    if (!down || cleared) return;
    const [lx, ly] = last, dx = e.clientX - lx, dy = e.clientY - ly, steps = Math.max(1, Math.hypot(dx, dy) / 14);
    for (let i = 1; i <= steps; i++) { hole(lx + dx * i / steps, ly + dy * i / steps, 46); userHoles++; }
    last = [e.clientX, e.clientY];
  });
  addEventListener('pointerup', () => { down = false; });
  addEventListener('keydown', e => { if (!cleared && (e.key === 'Enter' || e.key === ' ')) reveal(); });

  /* ===== Real couple video, when assets/couple.mp4 exists ===== */
  const cv = $('coupleVideo');
  let hasVideo = false;
  cv.addEventListener('loadeddata', () => { hasVideo = true; cv.hidden = false; $('coupleArt').hidden = true; });
  cv.querySelector('source').addEventListener('error', () => { hasVideo = false; });
  cv.load();

  /* ===== The reveal sequence ===== */
  const timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, reduce ? Math.min(ms, 400) : ms));
  function reveal() {
    if (cleared) return;
    cleared = true; stopMic();
    // melt the rest of the glitter from the cleared spots outwards, then fade it
    for (let i = 0; i < 26; i++) at(i * 45, () => { for (let j = 0; j < 14; j++) hole(Math.random() * W, Math.random() * H, 40 + Math.random() * 70); });
    at(500, () => { gl.classList.add('gone'); $('cover').classList.add('gone'); });
    if (navigator.vibrate) try { navigator.vibrate(25); } catch (e) {}
    at(900, () => document.body.classList.add('opening'));
    at(1300, () => { $('stage').classList.add('lit'); startDust(); if (hasVideo) { cv.currentTime = 0; cv.play().catch(() => {}); } });
    at(1500, () => $('wFam').classList.add('show'));
    at(2000, () => $('wN1').classList.add('write'));
    at(3300, () => $('wAmp').classList.add('show'));
    at(3700, () => $('wN2').classList.add('write'));
    at(5600, () => $('wReq').classList.add('show'));
    at(6200, () => { $('wDate').classList.add('show'); $('wPlace').classList.add('show'); });
    at(7200, () => $('after').classList.add('show'));
  }

  /* ===== Sparkle floating in the light ===== */
  const dc = $('dust'), dx = dc.getContext('2d'); let motes = [], dustOn = false;
  function startDust() {
    if (reduce || dustOn) return; dustOn = true;
    dc.width = W * DPR; dc.height = H * DPR; dx.setTransform(DPR, 0, 0, DPR, 0, 0);
    motes = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: .5 + Math.random() * 1.6, v: .1 + Math.random() * .35, p: Math.random() * 6.28 }));
    (function loop() {
      if (!dustOn) return;
      dx.clearRect(0, 0, W, H);
      for (const m of motes) {
        m.y -= m.v; m.p += .02; m.x += Math.sin(m.p) * .25; if (m.y < -4) { m.y = H + 4; m.x = Math.random() * W; }
        dx.globalAlpha = .4 + .4 * Math.sin(m.p * 2); dx.fillStyle = '#ffe1e5';
        dx.beginPath(); dx.arc(m.x, m.y, m.r, 0, 6.283); dx.fill();
      }
      requestAnimationFrame(loop);
    })();
  }

  /* ===== Replay ===== */
  $('again').addEventListener('click', () => {
    timers.splice(0).forEach(clearTimeout);
    document.body.classList.remove('opening');
    $('stage').classList.remove('lit');
    ['wFam', 'wAmp', 'wReq', 'wDate', 'wPlace', 'after'].forEach(id => $(id).classList.remove('show'));
    ['wN1', 'wN2'].forEach(id => $(id).classList.remove('write'));
    dustOn = false; dx.clearRect(0, 0, W, H);
    cleared = false; frame = 0; blowTime = 0; userHoles = 0;
    $('startBtn').hidden = false; $('call').textContent = 'Blow gently'; $('sub').textContent = 'one soft breath on your screen'; $('alt').hidden = false;
    buildGlitter();
    gl.classList.remove('gone'); $('cover').classList.remove('gone');
    requestAnimationFrame(drawGlitter);
  });

  function layout() {
    W = innerWidth; H = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
    drawCurtain($('curL'), false); drawCurtain($('curR'), true); drawValance();
    if (!cleared) buildGlitter();
  }
  addEventListener('resize', () => { const c = cleared; layout(); if (c) { gl.classList.add('gone'); } });
  layout();
  requestAnimationFrame(drawGlitter);
})();
</script>
</body>
</html>
